name: Daily Rates (FX + Fuel)

on:
  # Schedule disabled — collections run manually via PowerShell (run-weekly.ps1)
  # Uncomment below to re-enable automation:
  # schedule:
  #   - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Write Google credentials file
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python3 -c "import os; open('server/google-credentials.json','w').write(os.environ['GOOGLE_CREDS'])"
          echo "Credentials file size: $(wc -c < server/google-credentials.json) bytes"
          python3 -c "import json; json.load(open('server/google-credentials.json')); print('✓ JSON is valid')"

      - name: Create .env file
        run: |
          cat > server/.env << EOF
          DATA_DIR=/tmp/sgdatalytics-data
          MAX_PAGES=3
          BROWSER_HEADLESS=true
          NODE_ENV=production
          NEON_MARKET_PRICES=${{ secrets.NEON_MARKET_PRICES }}
          NEON_ACCOMMODATION=${{ secrets.NEON_ACCOMMODATION }}
          NEON_PROPERTY=${{ secrets.NEON_PROPERTY }}
          NEON_ECONOMIC=${{ secrets.NEON_ECONOMIC }}
          NEON_COMMODITIES=${{ secrets.NEON_COMMODITIES }}
          NEON_FINANCIALS=${{ secrets.NEON_FINANCIALS }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH=/home/runner/work/sgdatalytics-platform/sgdatalytics-platform/server/google-credentials.json
          EOF

      - name: Create data directory
        run: mkdir -p /tmp/sgdatalytics-data

      - name: Run BOG exchange rates
        run: cd server && node collectors/bog.js
        continue-on-error: true

      - name: Run NPA fuel prices
        run: cd server && node collectors/npa.js
        continue-on-error: true

      - name: Update Google Sheets (FX + Fuel tabs)
        run: cd server && node db/sheets-writer.js

      - name: Daily rates complete
        run: echo "✅ Daily rates finished at $(date)"
