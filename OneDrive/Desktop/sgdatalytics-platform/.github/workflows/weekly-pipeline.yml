name: Weekly Data Pipeline

on:
  # Schedule disabled — collections run manually via PowerShell (run-weekly.ps1)
  # Uncomment below to re-enable automation:
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:  # can still trigger manually from GitHub Actions UI

env:
  DATA_DIR: /tmp/sgdatalytics-data
  NODE_VERSION: '20'

jobs:

  # ── JOB 1: API Collectors ──────────────────────────────────────────────────
  api-collectors:
    name: API Collectors (WB · BOG · NPA · GSS · MOFA)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Write Google credentials
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDS" > server/google-credentials.json

      - name: Create .env
        run: |
          cat > server/.env << EOF
          DATA_DIR=${{ env.DATA_DIR }}
          BROWSER_HEADLESS=true
          NODE_ENV=production
          NEON_MARKET_PRICES=${{ secrets.NEON_MARKET_PRICES }}
          NEON_ACCOMMODATION=${{ secrets.NEON_ACCOMMODATION }}
          NEON_PROPERTY=${{ secrets.NEON_PROPERTY }}
          NEON_ECONOMIC=${{ secrets.NEON_ECONOMIC }}
          NEON_COMMODITIES=${{ secrets.NEON_COMMODITIES }}
          NEON_FINANCIALS=${{ secrets.NEON_FINANCIALS }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH=/home/runner/work/sgdatalytics-platform/sgdatalytics-platform/server/google-credentials.json
          EOF

      - name: Create data directory
        run: mkdir -p ${{ env.DATA_DIR }}

      - id: worldbank
        name: World Bank
        run: cd server && node collectors/worldbank.js
        continue-on-error: true

      - id: bog
        name: Bank of Ghana
        run: cd server && node collectors/bog.js
        continue-on-error: true

      - id: npa
        name: NPA Fuel Prices
        run: cd server && node collectors/npa.js
        continue-on-error: true

      - id: gss
        name: Ghana Statistical Service
        run: cd server && node collectors/gss.js
        continue-on-error: true

      - id: mofa
        name: MOFA Agricultural Prices
        run: cd server && node collectors/mofa.js
        continue-on-error: true

      - name: Update Google Sheets
        run: cd server && node db/sheets-writer.js
        continue-on-error: true

      - name: Notify on failures
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WB:   ${{ steps.worldbank.outcome }}
          BOG:  ${{ steps.bog.outcome }}
          NPA:  ${{ steps.npa.outcome }}
          GSS:  ${{ steps.gss.outcome }}
          MOFA: ${{ steps.mofa.outcome }}
        run: |
          FAILED=""
          COMMANDS=""
          [ "$WB"   = "failure" ] && FAILED="$FAILED World Bank," && COMMANDS="$COMMANDS\nnode collectors/worldbank.js"
          [ "$BOG"  = "failure" ] && FAILED="$FAILED BOG," && COMMANDS="$COMMANDS\nnode collectors/bog.js"
          [ "$NPA"  = "failure" ] && FAILED="$FAILED NPA Fuel," && COMMANDS="$COMMANDS\nnode collectors/npa.js"
          [ "$GSS"  = "failure" ] && FAILED="$FAILED GSS," && COMMANDS="$COMMANDS\nnode collectors/gss.js"
          [ "$MOFA" = "failure" ] && FAILED="$FAILED MOFA," && COMMANDS="$COMMANDS\nnode collectors/mofa.js"

          if [ -n "$FAILED" ]; then
            FAILED="${FAILED%,}"
            BODY="<h2 style='color:#c0392b'>⚠️ Weekly Pipeline — Collector Failures</h2>
            <p>The following API collectors failed on <strong>$(date '+%A %d %B %Y')</strong>:</p>
            <p style='color:#c0392b;font-weight:bold'>$FAILED</p>
            <p>Run these manually from PowerShell to collect the missing data:</p>
            <pre style='background:#f4f4f4;padding:16px;border-radius:6px;font-size:13px'>cd C:\\Users\\markt\\OneDrive\\Desktop\\sgdatalytics-platform\\server
            $(echo -e "$COMMANDS" | sed 's/^//')
            </pre>
            <p style='color:#666;font-size:13px'>Check the full run log at: https://github.com/marktetteh/sgdatalytics-platform/actions</p>"

            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"from\":\"SG Datalytics <data@sgdatalytics.org>\",\"to\":[\"marktetteh07@gmail.com\"],\"subject\":\"⚠️ Pipeline Alert — $FAILED failed\",\"html\":\"$BODY\"}"
            echo "Alert sent for:$FAILED"
          else
            echo "✅ All API collectors succeeded — no alert needed"
          fi


  # ── JOB 2: Market Scrapers ─────────────────────────────────────────────────
  market-scrapers:
    name: Market Scrapers (GSE · Jiji · Melcom · Esoko · Meqasa · Hotels · Airbnb)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Install Playwright + Chromium
        run: cd server && npx playwright install chromium --with-deps

      - name: Write Google credentials
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: echo "$GOOGLE_CREDS" > server/google-credentials.json

      - name: Create .env
        run: |
          cat > server/.env << EOF
          DATA_DIR=${{ env.DATA_DIR }}
          MAX_PAGES=3
          CONCURRENCY=2
          BROWSER_HEADLESS=true
          NODE_ENV=production
          NEON_MARKET_PRICES=${{ secrets.NEON_MARKET_PRICES }}
          NEON_ACCOMMODATION=${{ secrets.NEON_ACCOMMODATION }}
          NEON_PROPERTY=${{ secrets.NEON_PROPERTY }}
          NEON_ECONOMIC=${{ secrets.NEON_ECONOMIC }}
          NEON_COMMODITIES=${{ secrets.NEON_COMMODITIES }}
          NEON_FINANCIALS=${{ secrets.NEON_FINANCIALS }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH=/home/runner/work/sgdatalytics-platform/sgdatalytics-platform/server/google-credentials.json
          EOF

      - name: Create data directory
        run: mkdir -p ${{ env.DATA_DIR }}

      - id: gse
        name: Ghana Stock Exchange (GSE)
        run: cd server && node collectors/gse.js
        timeout-minutes: 10
        continue-on-error: true

      - id: jiji
        name: Jiji Ghana (market prices)
        run: cd server && node collectors/jiji.js
        timeout-minutes: 50
        continue-on-error: true

      - id: tonaton
        name: Tonaton Ghana (market prices)
        run: cd server && node collectors/tonaton.js
        timeout-minutes: 50
        continue-on-error: true

      - id: melcom
        name: Melcom Ghana (retail prices)
        run: cd server && node collectors/melcom.js
        timeout-minutes: 15
        continue-on-error: true

      - id: esoko
        name: Esoko (commodity prices)
        run: cd server && node collectors/esoko.js
        timeout-minutes: 10
        continue-on-error: true

      - id: meqasa
        name: Meqasa (property listings)
        run: cd server && node collectors/meqasa.js
        timeout-minutes: 15
        continue-on-error: true

      - id: hotels
        name: Hotels — Booking.com
        run: cd server && node collectors/hotels.js
        timeout-minutes: 10
        continue-on-error: true

      - id: airbnb
        name: Airbnb
        run: cd server && node collectors/airbnb.js
        timeout-minutes: 10
        continue-on-error: true

      - name: Weekly consolidation
        run: cd server && node collectors/consolidate.js
        continue-on-error: true

      - name: Notify on failures
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GSE:     ${{ steps.gse.outcome }}
          JIJI:    ${{ steps.jiji.outcome }}
          TONATON: ${{ steps.tonaton.outcome }}
          MELCOM:  ${{ steps.melcom.outcome }}
          ESOKO:   ${{ steps.esoko.outcome }}
          MEQASA:  ${{ steps.meqasa.outcome }}
          HOTELS:  ${{ steps.hotels.outcome }}
          AIRBNB:  ${{ steps.airbnb.outcome }}
        run: |
          FAILED=""
          COMMANDS=""
          [ "$GSE"     = "failure" ] && FAILED="$FAILED GSE,"     && COMMANDS="$COMMANDS\nnode collectors/gse.js"
          [ "$JIJI"    = "failure" ] && FAILED="$FAILED Jiji,"    && COMMANDS="$COMMANDS\nnode collectors/jiji.js"
          [ "$TONATON" = "failure" ] && FAILED="$FAILED Tonaton," && COMMANDS="$COMMANDS\nnode collectors/tonaton.js"
          [ "$MELCOM"  = "failure" ] && FAILED="$FAILED Melcom,"  && COMMANDS="$COMMANDS\nnode collectors/melcom.js"
          [ "$ESOKO"   = "failure" ] && FAILED="$FAILED Esoko,"   && COMMANDS="$COMMANDS\nnode collectors/esoko.js"
          [ "$MEQASA"  = "failure" ] && FAILED="$FAILED Meqasa,"  && COMMANDS="$COMMANDS\nnode collectors/meqasa.js"
          [ "$HOTELS"  = "failure" ] && FAILED="$FAILED Hotels,"  && COMMANDS="$COMMANDS\nnode collectors/hotels.js"
          [ "$AIRBNB"  = "failure" ] && FAILED="$FAILED Airbnb,"  && COMMANDS="$COMMANDS\nnode collectors/airbnb.js"

          if [ -n "$FAILED" ]; then
            FAILED="${FAILED%,}"
            BODY="<h2 style='color:#c0392b'>⚠️ Weekly Pipeline — Scraper Failures</h2>
            <p>The following scrapers failed on <strong>$(date '+%A %d %B %Y')</strong>:</p>
            <p style='color:#c0392b;font-weight:bold'>$FAILED</p>
            <p>Run these manually from PowerShell to collect the missing data:</p>
            <pre style='background:#f4f4f4;padding:16px;border-radius:6px;font-size:13px'>cd C:\\Users\\markt\\OneDrive\\Desktop\\sgdatalytics-platform\\server
            $(echo -e "$COMMANDS" | sed 's/^[[:space:]]*//')
            </pre>
            <p style='color:#666;font-size:13px'>Check the full run log: https://github.com/marktetteh/sgdatalytics-platform/actions</p>"

            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"from\":\"SG Datalytics <data@sgdatalytics.org>\",\"to\":[\"marktetteh07@gmail.com\"],\"subject\":\"⚠️ Pipeline Alert — $FAILED failed\",\"html\":\"$BODY\"}"
            echo "Alert sent for:$FAILED"
          else
            echo "✅ All scrapers succeeded — no alert needed"
          fi
